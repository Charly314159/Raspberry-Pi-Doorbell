blueprint:
  name: Visiophone – video message when nobody answers
  description: >
    When the doorbell rings and nobody answers within the waiting time, invites
    the visitor to press the button to leave a video message. A press starts
    the recording, a second press ends it (or the maximum length is reached),
    then your own actions run (for example a notification).

    Somebody "answers" when the live view is opened in a browser
    (`binary_sensor.<id>_live_view`), when the doorbell's Answer button is
    pressed, or when an actionable notification button with the chosen action
    ID is tapped.

    The button's LED ring (optional) shows what happens: it breathes while
    waiting for the visitor to press, blinks while recording, and returns to
    its previous state at the end.

    While a message is being left, the "message in progress" helper is on: add
    it as a condition to your ring automation so that these presses do not ring.

    The clip is always recorded for the maximum length (Home Assistant cannot
    stop a recording early): the second press only ends the message for the
    visitor. Clips and snapshots are saved under the chosen media folder.
    Variables available in your actions: `clip_path`, `clip_url`,
    `snapshot_url`, `media_id`.
  domain: automation
  author: Visiophone contributors
  homeassistant:
    min_version: "2026.7.0"
  input:
    doorbell:
      name: Doorbell
      icon: mdi:doorbell-video
      input:
        doorbell_event:
          name: Doorbell event
          selector:
            entity:
              domain: event
              device_class: doorbell
        live_view_sensor:
          name: Live view sensor
          description: binary_sensor.<id>_live_view of the doorbell.
          selector:
            entity:
              domain: binary_sensor
        answer_button:
          name: Answer button
          description: button.<id>_answer of the doorbell.
          selector:
            entity:
              domain: button
        camera:
          name: Doorbell camera
          selector:
            entity:
              domain: camera
        message_flag:
          name: Message in progress helper
          description: >
            An input_boolean (create it in Settings → Helpers, initial value
            off). Use it as a condition in your ring automation.
          selector:
            entity:
              domain: input_boolean
        led_light:
          name: Button LED (optional)
          description: light.<id>_led of the doorbell, with its effects.
          default: []
          selector:
            entity:
              domain: light
    voice:
      name: Voice messages
      icon: mdi:account-voice
      input:
        greeting_enabled:
          name: Speak to the visitor
          default: true
          selector:
            boolean: {}
        tts_engine:
          name: Text-to-speech engine
          default: []
          selector:
            entity:
              domain: tts
        speaker:
          name: Doorbell speaker
          description: Media player that plays on the doorbell (for example its MPD player).
          default: []
          selector:
            entity:
              domain: media_player
        greeting_message:
          name: Invitation
          default: Nobody can answer right now. To leave a video message, press the button.
          selector:
            text:
              multiline: true
        speak_message:
          name: Recording started
          default: Please speak now. Press the button again when you are done.
          selector:
            text:
              multiline: true
        thanks_message:
          name: Message recorded
          default: Thank you, your message has been recorded. Goodbye.
          selector:
            text:
              multiline: true
    settings:
      name: Settings
      icon: mdi:cog
      input:
        answer_timeout:
          name: Waiting time for an answer
          default: 30
          selector:
            number:
              min: 5
              max: 300
              unit_of_measurement: s
        start_timeout:
          name: Waiting time for the visitor to start
          description: After the invitation, how long to wait for a press.
          default: 20
          selector:
            number:
              min: 5
              max: 120
              unit_of_measurement: s
        record_seconds:
          name: Maximum message length
          default: 40
          selector:
            number:
              min: 10
              max: 120
              unit_of_measurement: s
        startup_seconds:
          name: Stream start-up time
          description: Delay between starting the recording and telling the visitor to speak.
          default: 4
          selector:
            number:
              min: 0
              max: 15
              unit_of_measurement: s
        media_folder:
          name: Media folder
          description: Folder under /media where clips are saved.
          default: visiophone
          selector:
            text: {}
        answer_action_id:
          name: Notification action ID for "Answer"
          description: Add a notification button with this action to your ring notification to answer from the phone.
          default: VISIOPHONE_ANSWER
          selector:
            text: {}
    when_recorded:
      name: When a message is recorded
      icon: mdi:message-video
      input:
        message_actions:
          name: Actions
          description: For example a notification with snapshot_url as image.
          default: []
          selector:
            action: {}

mode: single
max_exceeded: silent

variables:
  greeting_enabled: !input greeting_enabled
  tts_engine: !input tts_engine
  speaker: !input speaker
  record_seconds: !input record_seconds
  startup_seconds: !input startup_seconds
  media_folder: !input media_folder
  led_light: !input led_light
  has_led: "{{ led_light | length > 0 }}"
  speak: "{{ greeting_enabled and tts_engine | length > 0 and speaker | length > 0 }}"
  stamp: "{{ now().strftime('%Y-%m-%d_%H-%M-%S') }}"
  relative_clip: "{{ media_folder ~ '/' ~ stamp ~ '.mp4' }}"
  relative_snapshot: "{{ media_folder ~ '/' ~ stamp ~ '.jpg' }}"
  clip_path: "{{ '/media/' ~ relative_clip }}"
  clip_url: "{{ '/media/local/' ~ relative_clip }}"
  snapshot_url: "{{ '/media/local/' ~ relative_snapshot }}"
  media_id: "{{ 'media-source://media_source/local/' ~ relative_clip }}"

triggers:
  - trigger: event.received
    target:
      entity_id: !input doorbell_event
    options:
      event_type:
        - press

conditions:
  - alias: Not while a message is being left
    condition: state
    entity_id: !input message_flag
    state: "off"

actions:
  - alias: Wait for somebody to answer
    wait_for_trigger:
      - trigger: state
        entity_id: !input live_view_sensor
        to: "on"
      - trigger: state
        entity_id: !input answer_button
        not_from: unavailable
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: !input answer_action_id
    timeout:
      seconds: !input answer_timeout
    continue_on_timeout: true
  - alias: Stop if somebody answered
    condition: template
    value_template: "{{ wait.trigger is none }}"

  - alias: Message mode on (presses no longer ring)
    action: input_boolean.turn_on
    target:
      entity_id: !input message_flag
  - alias: LED breathes while waiting for the visitor
    if:
      - condition: template
        value_template: "{{ has_led }}"
    then:
      - action: scene.create
        data:
          scene_id: visiophone_led_before_message
          snapshot_entities: "{{ [led_light] }}"
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ led_light }}"
        data:
          effect: breathe
  - alias: Invitation
    if:
      - condition: template
        value_template: "{{ speak }}"
    then:
      - action: tts.speak
        continue_on_error: true
        target:
          entity_id: !input tts_engine
        data:
          media_player_entity_id: !input speaker
          message: !input greeting_message
  - alias: Wait for the visitor to press to start
    wait_for_trigger:
      - trigger: event.received
        target:
          entity_id: !input doorbell_event
        options:
          event_type:
            - press
    timeout:
      seconds: !input start_timeout
    continue_on_timeout: true
  - alias: No press, no message
    if:
      - condition: template
        value_template: "{{ wait.trigger is none }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: !input message_flag
      - if:
          - condition: template
            value_template: "{{ has_led }}"
        then:
          - action: scene.turn_on
            continue_on_error: true
            target:
              entity_id: scene.visiophone_led_before_message
      - stop: The visitor did not leave a message

  - alias: Record while the visitor speaks
    parallel:
      - alias: Recording (always the maximum length)
        action: camera.record
        target:
          entity_id: !input camera
        data:
          filename: "{{ clip_path }}"
          duration: "{{ record_seconds }}"
      - alias: Talk to the visitor
        sequence:
          - if:
              - condition: template
                value_template: "{{ has_led }}"
            then:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ led_light }}"
                data:
                  effect: blink
          - delay:
              seconds: "{{ startup_seconds }}"
          - action: camera.snapshot
            continue_on_error: true
            target:
              entity_id: !input camera
            data:
              filename: "{{ '/media/' ~ relative_snapshot }}"
          - if:
              - condition: template
                value_template: "{{ speak }}"
            then:
              - action: tts.speak
                continue_on_error: true
                target:
                  entity_id: !input tts_engine
                data:
                  media_player_entity_id: !input speaker
                  message: !input speak_message
          - alias: Wait for the press that ends the message
            wait_for_trigger:
              - trigger: event.received
                target:
                  entity_id: !input doorbell_event
                options:
                  event_type:
                    - press
            timeout:
              seconds: "{{ [record_seconds - startup_seconds, 1] | max }}"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ has_led }}"
            then:
              - action: scene.turn_on
                continue_on_error: true
                target:
                  entity_id: scene.visiophone_led_before_message
          - if:
              - condition: template
                value_template: "{{ speak }}"
            then:
              - action: tts.speak
                continue_on_error: true
                target:
                  entity_id: !input tts_engine
                data:
                  media_player_entity_id: !input speaker
                  message: !input thanks_message

  - alias: Message mode off
    action: input_boolean.turn_off
    target:
      entity_id: !input message_flag
  # camera.record returns once the clip is written; leave the file a moment to close
  - delay:
      seconds: 2
  - alias: Your actions
    sequence: !input message_actions
