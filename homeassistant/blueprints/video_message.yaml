blueprint:
  name: Visiophone – video message when nobody answers
  description: >
    When the doorbell rings and nobody answers within the waiting time, plays a
    greeting to the visitor, records a video clip from the doorbell camera and
    runs your own actions (for example a notification with the clip).

    Somebody "answers" when the live view is opened in a browser
    (`binary_sensor.<id>_live_view`), when the doorbell's Answer button is
    pressed, or when an actionable notification button with the chosen action
    ID is tapped.

    Clips and snapshots are saved under the chosen media folder and appear in
    Home Assistant's media browser. Variables available in your actions:
    `clip_path`, `clip_url`, `snapshot_url`, `media_id`.
  domain: automation
  author: Visiophone contributors
  homeassistant:
    min_version: "2026.7.0"
  input:
    doorbell:
      name: Doorbell
      icon: mdi:doorbell-video
      input:
        doorbell_event:
          name: Doorbell event
          selector:
            entity:
              domain: event
              device_class: doorbell
        live_view_sensor:
          name: Live view sensor
          description: binary_sensor.<id>_live_view of the doorbell.
          selector:
            entity:
              domain: binary_sensor
        answer_button:
          name: Answer button
          description: button.<id>_answer of the doorbell.
          selector:
            entity:
              domain: button
        camera:
          name: Doorbell camera
          selector:
            entity:
              domain: camera
    greeting:
      name: Greeting
      icon: mdi:account-voice
      input:
        greeting_enabled:
          name: Play a greeting
          default: true
          selector:
            boolean: {}
        tts_engine:
          name: Text-to-speech engine
          default: []
          selector:
            entity:
              domain: tts
        speaker:
          name: Doorbell speaker
          description: Media player that plays on the doorbell (for example its MPD player).
          default: []
          selector:
            entity:
              domain: media_player
        greeting_message:
          name: Greeting message
          default: Nobody can answer right now. Please leave a message after the beep, you are being recorded.
          selector:
            text:
              multiline: true
        greeting_seconds:
          name: Greeting duration
          description: Time to let the greeting play before recording starts.
          default: 7
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: s
    settings:
      name: Settings
      icon: mdi:cog
      input:
        answer_timeout:
          name: Waiting time
          description: How long to wait for an answer after a ring.
          default: 30
          selector:
            number:
              min: 5
              max: 300
              unit_of_measurement: s
        record_seconds:
          name: Message length
          default: 20
          selector:
            number:
              min: 5
              max: 120
              unit_of_measurement: s
        media_folder:
          name: Media folder
          description: Folder under /media where clips are saved.
          default: visiophone
          selector:
            text: {}
        answer_action_id:
          name: Notification action ID for "Answer"
          description: Add a notification button with this action to your ring notification to answer from the phone.
          default: VISIOPHONE_ANSWER
          selector:
            text: {}
    when_recorded:
      name: When a message is recorded
      icon: mdi:message-video
      input:
        message_actions:
          name: Actions
          description: For example a notification with snapshot_url as image and a link to the clip.
          default: []
          selector:
            action: {}

mode: single
max_exceeded: silent

variables:
  greeting_enabled: !input greeting_enabled
  tts_engine: !input tts_engine
  speaker: !input speaker
  record_seconds: !input record_seconds
  greeting_seconds: !input greeting_seconds
  media_folder: !input media_folder
  stamp: "{{ now().strftime('%Y-%m-%d_%H-%M-%S') }}"
  relative_clip: "{{ media_folder ~ '/' ~ stamp ~ '.mp4' }}"
  relative_snapshot: "{{ media_folder ~ '/' ~ stamp ~ '.jpg' }}"
  clip_path: "{{ '/media/' ~ relative_clip }}"
  clip_url: "{{ '/media/local/' ~ relative_clip }}"
  snapshot_url: "{{ '/media/local/' ~ relative_snapshot }}"
  media_id: "{{ 'media-source://media_source/local/' ~ relative_clip }}"

triggers:
  - trigger: event.received
    target:
      entity_id: !input doorbell_event
    options:
      event_type:
        - press

actions:
  - alias: Wait for somebody to answer
    wait_for_trigger:
      - trigger: state
        entity_id: !input live_view_sensor
        to: "on"
      - trigger: state
        entity_id: !input answer_button
        not_from: unavailable
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: !input answer_action_id
    timeout:
      seconds: !input answer_timeout
    continue_on_timeout: true
  - alias: Stop if somebody answered
    condition: template
    value_template: "{{ wait.trigger is none }}"
  - alias: Greeting
    if:
      - condition: template
        value_template: "{{ greeting_enabled and tts_engine | length > 0 and speaker | length > 0 }}"
    then:
      - action: tts.speak
        continue_on_error: true
        target:
          entity_id: !input tts_engine
        data:
          media_player_entity_id: !input speaker
          message: !input greeting_message
      - delay:
          seconds: "{{ greeting_seconds }}"
  - alias: Snapshot for the notification
    action: camera.snapshot
    continue_on_error: true
    target:
      entity_id: !input camera
    data:
      filename: "{{ '/media/' ~ relative_snapshot }}"
  - alias: Record the message
    action: camera.record
    target:
      entity_id: !input camera
    data:
      filename: "{{ clip_path }}"
      duration: "{{ record_seconds }}"
  # camera.record returns once the clip is written; leave the file a moment to close
  - delay:
      seconds: 2
  - alias: Your actions
    sequence: !input message_actions
